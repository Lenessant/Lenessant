    <line x1="750" y1="345" x2="750" y2="375"/>
    <line x1="570" y1="195" x2="600" y2="195"/>
    <line x1="900" y1="195" x2="930" y2="195"/>
    <path d="M750 30 L760 50 L740 50 Z" fill="#E8799F" stroke="none"/>
    <path d="M750 360 L760 340 L740 340 Z" fill="#E8799F" stroke="none"/>
    <path d="M615 195 L635 185 L635 205 Z" fill="#E8799F" stroke="none"/>
    <path d="M885 195 L865 185 L865 205 Z" fill="#E8799F" stroke="none"/>
    <path d="M635 80 L660 95 M860 80 L835 95 M635 310 L660 295 M860 310 L835 295" />
  </g>

  <!-- glitch layers of name -->
  <text x="754" y="210" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-weight="700"
        font-size="78"
        letter-spacing="22"
        fill="#9DE0E8" opacity="0.65">
    LENESSANT
