    <rect x="166" y="306" width="8" height="8"/>
    <rect x="1286" y="286" width="8" height="8"/>
    <rect x="1326" y="86" width="8" height="8"/>
    <circle cx="90" cy="160" r="4"/>
    <circle cx="1410" cy="240" r="4"/>
  </g>

