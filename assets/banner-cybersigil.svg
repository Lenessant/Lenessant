  </defs>

  <rect width="1500" height="400" fill="#FFF6F8"/>
  <rect width="1500" height="400" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g stroke="#F4A6C2" stroke-width="1.5" fill="none" opacity="0.7">
